# Fork CI (CleverPeopleOnly/ra-h_os): gates every push and PR on the checks
# we hold ourselves to — full test suite, full typecheck, and lint on the
# belief-owned surface. Full-repo lint is NOT gated here: upstream carries
# pre-existing lint debt that is out of scope for this fork; everything the
# belief system owns must lint clean (see lint:belief-surface in package.json).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repo vendors only vec0.dylib (macOS); Linux CI has no sqlite-vec
      # binary, so the SQLite client's vec0 virtual-table bootstrap would hard
      # fail. Fetch the matching-version Linux loadable extension into the path
      # the runtime resolver already looks up (vendor/sqlite-extensions/vec0.so).
      # Version MUST match the vendored dylib (see vec_version string in it).
      - name: Fetch sqlite-vec Linux extension
        env:
          SQLITE_VEC_VERSION: v0.1.7-alpha.2
        run: |
          mkdir -p vendor/sqlite-extensions
          curl -fSL -o /tmp/sqlite-vec.tar.gz \
            "https://github.com/asg017/sqlite-vec/releases/download/${SQLITE_VEC_VERSION}/sqlite-vec-${SQLITE_VEC_VERSION#v}-loadable-linux-x86_64.tar.gz"
          tar -xzf /tmp/sqlite-vec.tar.gz -C vendor/sqlite-extensions
          test -f vendor/sqlite-extensions/vec0.so

      - name: Test (full suite)
        run: npm test

      # next-env.d.ts is auto-generated by Next (on dev/build) and gitignored,
      # so a fresh CI checkout lacks it. Its `/// <reference types="next" />`
      # is what brings in the styled-jsx JSX augmentation that makes <style jsx>
      # type-check; without it tsc fails on upstream components. Recreate its
      # canonical reference lines so CI typechecks against the same types as dev.
      - name: Generate next-env.d.ts (Next type references)
        run: |
          printf '%s\n' \
            '/// <reference types="next" />' \
            '/// <reference types="next/image-types/global" />' > next-env.d.ts

      - name: Typecheck (full repo)
        run: npm run type-check

      - name: Lint (belief-owned surface)
        run: npm run lint:belief-surface
