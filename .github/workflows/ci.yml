# Fork CI (CleverPeopleOnly/ra-h_os): gates every push and PR on the checks
# we hold ourselves to — full test suite, full typecheck, and lint on the
# belief-owned surface. Full-repo lint is NOT gated here: upstream carries
# pre-existing lint debt that is out of scope for this fork; everything the
# belief system owns must lint clean (see lint:belief-surface in package.json).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (full suite)
        run: npm test

      - name: Typecheck (full repo)
        run: npm run type-check

      - name: Lint (belief-owned surface)
        run: npm run lint:belief-surface
